<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Rock-Paper-Scissors game! :D</h1>
    <script>
        let humanScore= 0;
        let computerScore=0;

        function getComputerChoice(computerValue){
            computerValue= Math.floor(Math.random() * 3);

            switch(computerValue){
                case 0:
                    return 'scissors';
                    break;
        
                case 1:
                    return 'paper';
                    break;
        
                case 2:
                    return 'rock';
                    break;
            }
        }

        function getHumanChoice(humanValue){
            humanValue= prompt('Type a choice (Rock, Paper or Scissors)'); 
            return humanValue.toLowerCase();
        }
    
        function playRound(humanChoice, computerChoice){
            if (humanChoice==computerChoice){
                return ('Its a draw');
            }else if(
                (humanChoice=='rock' && computerChoice=='scissors')||
                (humanChoice=='scissors' && computerChoice=='paper')||
                (humanChoice=='paper' && computerChoice=='rock')
            ){
                humanScore++;
                return (`You win! ${humanChoice} beats ${computerChoice}`);
            }else{
                computerScore++;
                return (`You lose D: ${computerChoice} beats ${humanChoice}`);
            }
        }

        function playGame(){
            for(let i=0; i<5; i++){
                const humanSelection  = getHumanChoice();
                const computerSelection  = getComputerChoice();
                alert(
                    `Round ${i+1}\n`+
                    playRound(humanSelection , computerSelection )
                );
            }

            alert(
                `final human score: ${humanScore}\nfinal computer score: ${computerScore}`
            );

            if(humanScore>computerScore){
                alert('Human wins! :D');
            }else if(computerScore>humanScore){
                alert('Computer wins :o');
            }else{
                alert('Its a draw D:');
            }
        }

        playGame();
    </script>
</body>
</html>
