<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getComputerChoice(computerValue){
            computerValue= Math.floor(Math.random() * 3);

            switch(computerValue){
                case 0:
                    return 'Rock';
                    break;
        
                case 1:
                    return 'Paper';
                    break;
        
                case 2:
                    return 'Scissors';
                    break;
            }
        }

        function getHumanChoice(humanValue){
            humanValue= prompt('Tpye a choice (Rock, Paper or Scissors)'); 

            if(humanValue=='Rock' || humanValue=='Paper' || humanValue=='Scissors'){
                return(humanValue);
            }else{
                alert('Please type a valid value');
            }
        }
    </script>
</body>
</html>
